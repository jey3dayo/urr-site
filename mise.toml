# ========================================
# グローバル設定
# ========================================

[env]
_.file = [".env"]
_.path = ["./node_modules/.bin"]

MD_GLOB = "**/*.md"
MD_EXCLUDE_NODE_MODULES = "#**/node_modules/**"
MD_EXCLUDE_DIST = "#**/dist/**"
MD_EXCLUDE_ASTRO = "#**/.astro/**"
MD_EXCLUDE_WORKTREES = "#**/.worktrees/**"

# ========================================
# ツール
# ========================================

[tools]
node = "24.14.1"
pnpm = "10.33.0"
"pipx:yamllint" = "latest"

# ========================================
# コマンド（実処理タスク）
# ========================================

[tasks.format]
description = "Biome と Markdownlint で整形"
run = [
  "pnpm run format",
  "pnpm markdownlint-cli2 '${MD_GLOB}' ${MD_EXCLUDE_NODE_MODULES} ${MD_EXCLUDE_DIST} ${MD_EXCLUDE_ASTRO} ${MD_EXCLUDE_WORKTREES} --fix"
]

[tasks."lint:types"]
description = "TypeScript の型チェック"
run = "pnpm tsc --noEmit"

[tasks."lint:biome"]
description = "Biome による lint"
run = "pnpm run lint"

[tasks."lint:md"]
description = "Markdownlint による Markdown チェック"
run = "pnpm markdownlint-cli2 '${MD_GLOB}' ${MD_EXCLUDE_NODE_MODULES} ${MD_EXCLUDE_DIST} ${MD_EXCLUDE_ASTRO} ${MD_EXCLUDE_WORKTREES}"

[tasks."lint:yaml"]
description = "yamllint による YAML チェック"
run = "yamllint -c .yamllint .github/"

[tasks."cf:whoami"]
description = "dotenvx経由でCloudflare認証状態を確認"
run = "pnpm exec dotenvx run --overload -f .env -- wrangler whoami"

[tasks."build:ci"]
description = "CI向けの静的ビルド"
run = "pnpm run build"

[tasks."deploy:dry-run"]
description = "Cloudflare Workersへのデプロイ内容を確認"
run = "pnpm run cf:deploy:dry-run"

# ========================================
# エイリアス（まとめ実行）
# ========================================

[tasks.check]
description = "ローカル確認（format + lint + build + Cloudflare dry-run）"
depends = ["format", "lint", "build:ci", "deploy:dry-run"]

[tasks.lint]
description = "型・Biome・Markdown・YAML の lint"
depends = ["lint:types", "lint:biome", "lint:md", "lint:yaml"]

[tasks."check:quick"]
description = "クイックチェック（型 + Biome）"
depends = ["lint:types", "lint:biome"]

[tasks.ci]
description = "CI 相当のチェック（lint + build + Cloudflare dry-run）"
depends = ["lint", "build:ci", "deploy:dry-run"]

[tasks.deploy]
description = "Cloudflare Workers にデプロイ"
run = "pnpm run deploy"
